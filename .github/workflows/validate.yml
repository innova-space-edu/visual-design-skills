name: Validate skills
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run validate
      - run: npm run route -- "mapa real con coordenadas y cinco ubicaciones"
      - run: npm run validate:brief -- examples/poster.json
      - run: npm run select:backend -- examples/selfie-identity.json
      - run: npm run compile -- flux examples/selfie-identity.json
      - run: npm run compile -- svg examples/technical-floorplan.json
